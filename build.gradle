/* 
------------------------------------------------------------------------------------
Project: ATOPizzaFactory.ToolKit (Library/Toolkit)
Description:
    It defines global configuration for all modules, including group, version, and
    repositories. The script applies the 'java-library' and 'maven-publish' plugins
    at the project level. Maven Central is used for dependency resolution, and a
    private Azure Artifacts Maven repository is configured for publishing artifacts.
    Publishing is protected to prevent accidental uploads unless the property
    '-PallowPublish=true' is explicitly set.
------------------------------------------------------------------------------------
*/

plugins {
   id 'maven-publish'
   id 'java-library'
}

ext {
    projectName = 'ATOPizzaFactory.ToolKit'
}

allprojects {
    group = 'com.akimbotheone.atopizzafactory.toolkit'
    version = '1.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

publishing {
    publications {
        library(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url 'https://pkgs.dev.azure.com/akimbotheone/ATOPizzaFactoryLab/_packaging/ATOPFToolKitFeed/maven/v1'
            name 'ATOPFToolKitFeed'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

// Prevent accidental publishing unless -PallowPublish=true is set
tasks.withType(PublishToMavenRepository).configureEach {
    onlyIf {
        if (!project.hasProperty('allowPublish')) {
            logger.lifecycle("Publishing is disabled for local builds. Use -PallowPublish=true to enable.")
            return false
        }
        return true
    }
}
