// This is the build script for the ATOPFToolKit project.

plugins {
    id 'maven-publish'
    id 'java-library'
}

allprojects {
    group = 'com.company'
    version = '1.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

publishing {
    publications {
        library(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url 'https://pkgs.dev.azure.com/akimbotheone/ATOPizzaFactoryLab/_packaging/ATOPFToolKitFeed/maven/v1'
            name 'ATOPFToolKitFeed'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

// Prevent accidental publishing unless -PallowPublish=true is set
tasks.withType(PublishToMavenRepository).configureEach {
    onlyIf {
        if (!project.hasProperty('allowPublish')) {
            logger.lifecycle("Publishing is disabled for local builds. Use -PallowPublish=true to enable.")
            return false
        }
        return true
    }
}
