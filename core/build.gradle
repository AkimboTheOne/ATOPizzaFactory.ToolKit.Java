/*
------------------------------------------------------------------------------------
Module: core
Description:
    The purpose of this module is to contain the most basic Java classes and objects
    that serve as the foundation for the rest of the toolkit. It applies the
    'java-library' plugin for API/implementation separation and 'maven-publish' for
    artifact publishing. Dependencies include Apache Commons Math for mathematical
    utilities, Google Guava for core utilities, and JUnit Jupiter for unit testing.
------------------------------------------------------------------------------------
*/

plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'maven-publish'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'org.apache.commons:commons-math3:3.6.1'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:33.2.0-jre'

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    // Clean up previous test results before running tests.
    dependsOn 'cleanTest'

    // Use JUnit Platform for running tests.
    useJUnitPlatform()
}
